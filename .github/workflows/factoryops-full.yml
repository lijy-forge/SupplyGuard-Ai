name: SupplyGuard Full Architecture
on: [push, pull_request]
jobs:
  java:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/business-service}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn --batch-mode verify
  agent:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/agent-service}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[test]'
      - run: pytest -q
  ui:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/factoryops-ui}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/factoryops-ui/package-lock.json}
      - run: npm install
      - run: npm run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker/docker-compose.factoryops.yml config
