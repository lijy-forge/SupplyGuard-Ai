[project]
name = "factoryops-agent-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1",
  "langgraph>=0.6,<2", "langgraph-checkpoint-redis>=0.1,<1", "redis>=5,<7",
  "neo4j>=5.28,<7", "qdrant-client[fastembed]>=1.14.2,<2", "pika>=1.3,<2",
  "langfuse>=3,<5", "pydantic-settings>=2.8,<3"
]
[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["factoryops_agent"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
