spring:
  datasource:
    url: jdbc:h2:mem:factoryops;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        auto-startup: false
factoryops:
  outbox:
    exchange: factoryops.events
    poll-ms: 999999
