spring:
  application:
    name: factoryops-business-service
  datasource:
    url: ${FACTORYOPS_MYSQL_URL:jdbc:mysql://localhost:3306/factoryops?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${FACTORYOPS_MYSQL_USER:factoryops}
    password: ${FACTORYOPS_MYSQL_PASSWORD:factoryops_local_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  rabbitmq:
    host: ${FACTORYOPS_RABBITMQ_HOST:localhost}
    port: ${FACTORYOPS_RABBITMQ_PORT:5672}
    username: ${FACTORYOPS_RABBITMQ_USER:factoryops}
    password: ${FACTORYOPS_RABBITMQ_PASSWORD:factoryops_local_only}
management:
  endpoints.web.exposure.include: health,info
server:
  port: ${FACTORYOPS_BUSINESS_PORT:8081}
factoryops:
  outbox:
    enabled: ${FACTORYOPS_OUTBOX_PUBLISHER_ENABLED:true}
    exchange: factoryops.events
