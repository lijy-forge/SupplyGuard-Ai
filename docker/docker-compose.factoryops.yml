name: factoryops-ai
services:
  mysql:
    image: mysql:8.4
    environment: {MYSQL_DATABASE: factoryops, MYSQL_USER: factoryops, MYSQL_PASSWORD: factoryops, MYSQL_ROOT_PASSWORD: root}
    ports: ["3306:3306"]
    healthcheck: {test: ["CMD","mysqladmin","ping","-h","localhost","-proot"], interval: 5s, timeout: 5s, retries: 20}
    volumes: [mysql-data:/var/lib/mysql]
  redis:
    # RedisSaver uses RedisJSON/RediSearch indexes for durable LangGraph
    # checkpoints; Redis Stack provides those modules as one managed service.
    image: redis/redis-stack-server:7.4.0-v3
    environment: {REDIS_ARGS: "--appendonly yes"}
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 5s, timeout: 3s, retries: 20}
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports: ["5672:5672","15672:15672"]
    healthcheck: {test: ["CMD","rabbitmq-diagnostics","-q","ping"], interval: 8s, timeout: 5s, retries: 20}
  neo4j:
    image: neo4j:5-community
    environment: {NEO4J_AUTH: neo4j/factoryops}
    ports: ["7474:7474","7687:7687"]
    volumes: [neo4j-data:/data]
    healthcheck: {test: ["CMD-SHELL","cypher-shell -u neo4j -p factoryops 'RETURN 1'"], interval: 10s, timeout: 10s, retries: 30}
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports: ["6333:6333","6334:6334"]
    volumes: [qdrant-data:/qdrant/storage]
    healthcheck: {test: ["CMD","/qdrant/qdrant","--version"], interval: 5s, timeout: 5s, retries: 30}
  business-service:
    build: ../services/business-service
    environment: {FACTORYOPS_MYSQL_URL: "jdbc:mysql://mysql:3306/factoryops?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC", FACTORYOPS_MYSQL_USER: factoryops, FACTORYOPS_MYSQL_PASSWORD: factoryops, FACTORYOPS_RABBITMQ_HOST: rabbitmq, FACTORYOPS_RABBITMQ_USER: guest, FACTORYOPS_RABBITMQ_PASSWORD: guest}
    ports: ["8081:8081"]
    depends_on: {mysql: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}
    # Healthy only once Spring Boot is listening (after Flyway migrations), not merely when a JVM exists.
    healthcheck: {test: ["CMD","bash","-c","exec 3<>/dev/tcp/127.0.0.1/8081"], interval: 10s, timeout: 5s, retries: 30, start_period: 30s}
  agent-service:
    build: ../services/agent-service
    environment: {FACTORYOPS_RISK_EVIDENCE_MODE: live, FACTORYOPS_BUSINESS_URL: "http://business-service:8081/api/v1", FACTORYOPS_REDIS_URL: "redis://redis:6379/0", FACTORYOPS_NEO4J_URI: "bolt://neo4j:7687", FACTORYOPS_QDRANT_URL: "http://qdrant:6333", FACTORYOPS_RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/%2F"}
    ports: ["8082:8082"]
    depends_on: {business-service: {condition: service_healthy}, redis: {condition: service_healthy}, neo4j: {condition: service_healthy}, qdrant: {condition: service_healthy}}
    healthcheck: {test: ["CMD-SHELL","python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8082/health')\""], interval: 10s, timeout: 5s, retries: 30}
  agent-worker:
    build: ../services/agent-service
    command: ["python","-m","factoryops_agent.worker"]
    restart: on-failure  # RabbitMQ may still be booting on first connect
    environment: {FACTORYOPS_REDIS_URL: "redis://redis:6379/0", FACTORYOPS_RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/%2F"}
    depends_on: {redis: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}
  frontend:
    build: ../apps/factoryops-ui
    ports: ["3000:80"]
    depends_on: {agent-service: {condition: service_healthy}}
    healthcheck: {test: ["CMD-SHELL","wget -q -O - http://localhost/ >/dev/null"], interval: 10s, timeout: 5s, retries: 30}
volumes: {mysql-data: {}, redis-data: {}, neo4j-data: {}, qdrant-data: {}}
